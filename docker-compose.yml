version: "3.9"

services:

  backend:
    build: ./server
    container_name: foodwise_backend
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    restart: always

  frontend:
    build: ./client
    container_name: foodwise_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always